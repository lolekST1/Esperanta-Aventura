name: Deploy to GitHub Pages

# WYŁĄCZONE auto-deployowanie z tej gałęzi (2026-07-07): treść tego
# brancha (razem z main) została scalona do
# claude/esperanta-aventuro-game-eepx44, który jest teraz JEDYNYM
# źródłem prawdy dla GitHub Pages (patrz jego
# .github/workflows/pages.yml). Ta gałąź kiedyś deployowała przy KAŻDYM
# pushu na KAŻDĄ gałąź repo, co powodowało, że różne, rozbieżne linie
# rozwoju nadpisywały sobie nawzajem gotową stronę. Zostaje tylko
# workflow_dispatch (ręczne odpalenie), gdyby ktoś naprawdę chciał
# przetestować akurat tę gałąź na Pages.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push game content to gh-pages
        run: |
          rm -rf .github
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy-tmp
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push origin deploy-tmp:gh-pages --force
